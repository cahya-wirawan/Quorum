[project]
name = "quorum-monorepo"
version = "0.1.0"
description = "Quorum AI Code Review monorepo"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --cov=packages --cov=services"
testpaths = ["tests", "packages/core/tests"]

[tool.mypy]
strict = true
exclude = ["tests/", "evals/"]

[tool.ruff]
line-length = 100
target-version = "py311"
