# Alembic configuration for Quorum Monorepo

[alembic]
# Path to migration environment scripts
script_location = packages/storage/quorum_storage/migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with project roots
prepend_sys_path = .:packages/storage:packages/core
path_separator = os

# Timezone to use for revision dates
timezone = UTC

# Truncate slug length
truncate_slug_length = 40

# Database URL used by CLI (override with QUORUM_DATABASE_URL or DATABASE_URL)
sqlalchemy.url = sqlite:///quorum_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
