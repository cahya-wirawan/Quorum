name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Architecture & Eval Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make setup

      - name: Syntax & Lint Validation
        run: make lint

      - name: Architecture Boundary Verification
        run: make test-architecture

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-integration

      - name: Database Migration Tests
        run: make test-migrations

      - name: AI Evaluation Gates
        run: make eval
